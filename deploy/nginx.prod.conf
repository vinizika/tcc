# Nginx do frontend em produção (montado por docker-compose.prod.yml no lugar de
# frontend-react/nginx.conf). Mesma função do original — React estático e
# /api/ repassado ao backend — mais o que a internet exige:
# - limites de taxa por IP: o /chat/, o /voice/ e as rotas de clínicas (que
#   gastam cota do Gemini e a chave paga do Maps) mais apertados que o resto;
# - client_max_body_size compatível com o áudio de 25 MB do /voice/;
# - cabeçalhos básicos de segurança.
# O Caddy fica na frente deste Nginx e cuida do HTTPS.

limit_req_zone $binary_remote_addr zone=api_geral:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_pesada:10m rate=12r/m;
limit_req_status 429;

# O backend é resolvido pelo DNS do Docker de novo a cada 10 s (nginx ≥ 1.27.3).
# Com o nome fixo, recriar só o backend deixava este Nginx apontando para o IP
# antigo, e toda a API respondia 502 até reiniciar o frontend (visto em 19/10).
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_api {
  zone backend_api 64k;
  server backend:8000 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Rotas que chamam serviço pago ou cotado: um pedido a cada 5 s por IP, com
  # uma rajada curta. Um tutor digitando não chega perto disso.
  location /api/chat/ {
    limit_req zone=api_pesada burst=6 nodelay;
    proxy_pass http://backend_api/chat/;
    include /etc/nginx/conf.d/proxy-comum.inc;
  }
  location /api/voice/ {
    limit_req zone=api_pesada burst=6 nodelay;
    proxy_pass http://backend_api/voice/;
    include /etc/nginx/conf.d/proxy-comum.inc;
  }
  location /api/clinics/ {
    limit_req zone=api_pesada burst=6 nodelay;
    proxy_pass http://backend_api/clinics/;
    include /etc/nginx/conf.d/proxy-comum.inc;
  }

  # O resto da API (workspace, login, encaminhamentos). O polling do workspace
  # faz um GET a cada 2 s por conversa aberta; 120 por minuto com rajada cobre.
  location /api/ {
    limit_req zone=api_geral burst=60 nodelay;
    proxy_pass http://backend_api/;
    include /etc/nginx/conf.d/proxy-comum.inc;
  }

  location / {
    try_files $uri /index.html;
  }
}
