name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-torch-cpu.txt
            backend/requirements.txt
            backend/requirements-dev.txt
            scripts/requirements.txt
      - name: Install CPU Torch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          -r backend/requirements-torch-cpu.txt
      - name: Install project dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-dev.txt
          -r scripts/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test backend
        env:
          DEBUG: "true"
        run: python -m pytest -q backend/tests
      - name: Test scripts
        run: python -m pytest -q scripts/tests
      - name: Compile Python
        run: python -m compileall -q backend/app scripts
