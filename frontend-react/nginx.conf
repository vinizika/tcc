server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O padrão do Nginx é 1 MB: barrava o áudio do /voice/ (até 25 MB) e os
  # documentos anexados (até 10 MB) antes de chegarem ao backend.
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;

    # A pré-triagem local faz mais de uma geração no Ollama e pode levar
    # minutos em CPU. O backend admite 600 s; o proxy precisa esperar pelo
    # mesmo trabalho em vez de devolver o timeout padrão de 60 s.
    proxy_connect_timeout 10s;
    proxy_send_timeout 660s;
    proxy_read_timeout 660s;
  }

  location / {
    try_files $uri /index.html;
  }
}
